<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>1</title>
    </head>
    <body>
        <h3>eval()로 수식 계산</h3>
        <hr>
        <script>
            let exp= prompt("수식 입력");
            let n = eval(exp);
            document.write(exp + "=" + n);
        </script>
    </body>
</html>
