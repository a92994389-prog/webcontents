<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>do-while 문</title>
    </head>
    <body>
        <h3>do-while 문으로 0에서 n까지의 합</h3>
        <hr>
        <script>
            let i=0, sum=0;
            while(true){
                sum +=i;
                if(sum>3000)
                    break;
                i++;
            }
            document.write(i+"까지 더하면 3000을 넘음" + sum);
        </script>
    </body>
</html>
