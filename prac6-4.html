<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>if-else</title>
    </head>
    <body>
        <h3>월화수목금토일</h3>
        <hr>
        <script>
            let day=prompt("월화수목금토일중에 입력하세요");
            switch(day){
                case"월":
                case "화":
                case"수":
                case"목":
                case"금": document.write("정상영업");
                break;
                case"토":
                case"일": document.write("휴일");
                break;
            }
        </script>
    </body>
</html>
