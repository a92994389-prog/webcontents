<!DOCTYPE html>
<html>
    <head><meta charset="utf-8">
        <title>애니메이션</title>
        <style>
            @keyframes rotate{
                0%{transform: rotate(0deg);}
                50%{transform: rotate(-90deg);}
                100%{transform: rotate(90deg);}
            }
            img{
                animation-name: rotate;
                animation-duration: 1s;
                animation-iteration-count: infinite;
            }
        </style>
    </head>
    <body>
        <h3>어지러워요</h3>
        <hr>
        <img src="media/스폰지밥.png">
    </body>
</html>
